<!doctype html>
<html lang="en-UK" data-theme="light">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Model Number Rank · fount agent lab</title>
	<meta name="description" content="Live ranking of mainstream AI models.">
	<meta name="color-scheme" content="light dark">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Model Number Rank">
	<meta property="og:description" content="Live ranking of mainstream AI models.">
	<link rel="icon" type="image/svg+xml" href="https://steve02081504.github.io/fount/imgs/icon.svg">
	<script>
		; (() => {
			let stored = null
			try {
				stored = localStorage.getItem('model-number-rank.theme')
			} catch { /* ignore */ }
			const fromUrl = new URLSearchParams(location.search).get('theme')
			const dark = fromUrl
				? fromUrl === 'dark'
				: (stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
			document.documentElement.dataset.theme = dark ? 'dark' : 'light'
		})()
	</script>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" crossorigin="anonymous">
	<link href="https://cdn.jsdelivr.net/npm/daisyui/themes.css" rel="stylesheet" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" crossorigin="anonymous"></script>
</head>

<body class="min-h-screen bg-base-100 text-base-content">
	<div class="mx-auto flex max-w-[1500px] flex-col gap-4 px-4 py-6 sm:px-8">
		<header class="flex flex-wrap items-start justify-between gap-4">
			<div>
				<h1 class="text-2xl font-bold tracking-tight sm:text-4xl" data-i18n="title"></h1>
				<p class="mt-1 text-sm opacity-70" id="subtitle"></p>
			</div>
			<div class="flex items-center gap-2">
				<select class="select select-bordered select-sm w-auto" id="langSelect" aria-label="Language"></select>
				<button class="btn btn-ghost btn-sm btn-square" id="themeToggle" aria-label="Theme">
					<iconify-icon id="themeIcon" icon="lucide:moon" width="20" height="20"></iconify-icon>
				</button>
			</div>
		</header>

		<div class="flex flex-wrap gap-x-4 gap-y-2 text-sm opacity-80" id="legend"></div>
		<div class="min-h-5 text-sm opacity-70" id="status"></div>

		<section class="card border border-base-300 bg-base-200 shadow-sm">
			<div class="card-body p-2 sm:p-4">
				<div class="h-[68vh] min-h-[520px] w-full" id="chart"></div>
			</div>
		</section>

		<p class="text-center text-sm opacity-70" data-i18n="xAxis"></p>
		<p class="text-center text-xs opacity-60" data-i18n="note"></p>

		<footer class="mt-2 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm opacity-80">
			<a id="repoLink" class="link link-hover link-primary" href="https://github.com/steve02081504/model-number-rank" target="_blank" rel="noopener" data-i18n="github"></a>
			<a id="labLink" class="link link-hover" href="https://steve02081504.github.io/fount/blog/" target="_blank" rel="noopener" data-i18n="producedBy" data-i18n-title="blog"></a>
		</footer>
	</div>

	<script type="module" src="./src/app.mjs"></script>
</body>

</html>
